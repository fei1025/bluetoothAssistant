name: Build test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build downloadable Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore required fixed test signing key
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
        run: python -B scripts/ci_debug_signing.py restore --destination "$RUNNER_TEMP/bluetooth-ci-debug.keystore"
      - name: Prepare disposable Firebase configuration
        run: python -B scripts/prepare_offline_google_services.py --ci
      - name: Build APK and run JVM tests
        run: bash ./gradlew --no-daemon -PofflineAudit -PciDebugKeystore="$RUNNER_TEMP/bluetooth-ci-debug.keystore" testDebugUnitTest assembleDebug
      - name: Verify APK has the fixed test certificate
        run: python -B scripts/ci_debug_signing.py verify-apk --apk app/build/outputs/apk/debug/app-debug.apk --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Prepare APK, checksum and commit information
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          output = Path('dist')
          output.mkdir()
          name = 'bluetooth-assistant-debug-' + os.environ['GITHUB_SHA'][:8] + '.apk'
          target = output / name
          shutil.copyfile('app/build/outputs/apk/debug/app-debug.apk', target)
          checksum = hashlib.sha256(target.read_bytes()).hexdigest()
          (output / 'SHA256SUMS.txt').write_text(checksum + '  ' + name + '\n')
          metadata = json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          info = {'commit': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF'],
                  'versionName': metadata['elements'][0]['versionName'],
                  'versionCode': metadata['elements'][0]['versionCode'],
                  'applicationId': metadata['applicationId'], 'variant': 'debug',
                  'offlineAudit': True, 'pluginDeveloperMode': True, 'sha256': checksum,
                  'signingCertificateSha256': Path('.github/ci-debug-signing.sha256').read_text().strip()}
          (output / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Test APK ready\n\nDownload **test-apk-' + os.environ['GITHUB_SHA'] + '** from this run\'s Artifacts section.\n\n')
              summary.write('Debug/test build with Firebase collection disabled. A production installation requires the original signing key; do not uninstall an existing app to bypass a signature mismatch.\n')
              summary.write('\nFixed test certificate SHA-256: `' + info['signingCertificateSha256'] + '`. Future APKs with this identity can update this test installation without clearing its data.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apk-build-test-reports-${{ github.sha }}
          path: app/build/reports/
          retention-days: 7
