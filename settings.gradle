pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup 'com.github.amoskorir'
                includeGroup 'com.github.mcxtzhang'
                includeGroup 'com.github.amitshekhariitbhu.Android-Debug-Database'
            }
        }
        // Legacy artifacts unavailable in Central; never use this mirror for AndroidX/Google.
        maven {
            url 'https://maven.aliyun.com/repository/public'
            content {
                includeGroup 'org.litepal.guolindev'
                includeGroup 'com.amitshekhar.android'
            }
        }
    }
}
rootProject.name = "BluetoothSMP"
include ':app'
