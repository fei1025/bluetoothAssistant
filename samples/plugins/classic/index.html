<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Bluetooth example</title></head><body><h1>SPP 控制面板</h1><p id="status">初始化 / Initializing…</p><section><label>SPP UUID<input id="uuid" value="00001101-0000-1000-8000-00805F9B34FB"></label><button id="paired">已配对设备 / Paired devices</button><div class="row"><button id="scan">扫描 / Scan</button><button id="stop-scan">停止扫描 / Stop scan</button></div><select id="devices"><option value="">请选择设备 / Select device</option></select><div class="row"><button id="connect">连接 / Connect</button><button id="disconnect">断开 / Disconnect</button></div></section><section><h2>发送 / Send</h2><select id="encoding"><option value="text">UTF-8</option><option value="hex">HEX</option></select><input id="payload" placeholder="指令 / Command"><label><input id="crlf" type="checkbox">文本追加 CRLF / Append CRLF to text</label><button id="send">发送一次 / Send once</button><button id="save">保存输入 / Save input</button></section><section><h2>收发记录 / Traffic</h2><pre id="log"></pre></section><script src="main.js"></script></body></html>
