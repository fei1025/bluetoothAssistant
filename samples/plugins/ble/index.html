<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Bluetooth example</title></head><body><h1>BLE 数据面板</h1><p id="status">初始化 / Initializing…</p><section><label>名称前缀 / Name prefix<input id="prefix" placeholder="optional"></label><div class="row"><button id="scan">扫描 / Scan</button><button id="stop-scan">停止扫描 / Stop scan</button></div><select id="devices"><option value="">请选择设备 / Select device</option></select><div class="row"><button id="connect">连接 / Connect</button><button id="disconnect">断开 / Disconnect</button></div></section><section><h2>特征 / Characteristics</h2><select id="characteristics"></select><div class="row"><button id="services">刷新服务 / Services</button><button id="read">读取 / Read</button><button id="notify">Notify</button><button id="indicate">Indicate</button><button id="unsubscribe">取消订阅 / Unsubscribe</button></div><label>MTU<input id="mtu" type="number" min="23" max="517" value="247"></label><button id="request-mtu">请求 MTU / Request MTU</button><button id="rssi">读取 RSSI / Read RSSI</button><canvas id="chart" width="600" height="180"></canvas><small>接收首字节曲线（0–255） / First received byte</small></section><section><h2>发送 / Send</h2><select id="encoding"><option value="text">UTF-8</option><option value="hex">HEX</option></select><input id="payload" placeholder="指令 / Command"><label><input id="without-response" type="checkbox">无响应写入 / Write without response</label><label><input id="split" type="checkbox">设备协议支持透传分包 / Enable protocol-specific splitting</label><button id="send">发送一次 / Send once</button><button id="save">保存输入 / Save input</button></section><section><h2>收发记录 / Traffic</h2><pre id="log"></pre></section><script src="main.js"></script></body></html>
